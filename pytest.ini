[pytest]
# Restrict default discovery to the root platform tests directory
testpaths = tests

# Explicit root-level Python path resolution
pythonpath = .

# Concise reporting, ignore microservices during monorepo root runs
addopts =
    -ra
    -q
    --ignore=apps
    --ignore=mcp-servers
    --ignore=infra

# A known defect is pinned as @pytest.mark.xfail(strict=True, reason="FD-xx: ..."): when the defect is fixed the
# test XPASSes and fails the run, so the fixing change must delete the marker (Wave 1 standing rule).
xfail_strict = true

markers =
    live: needs real network or credentials; skipped unless --run-live (the hermetic guard stays on unless STACKVEND_ALLOW_NETWORK=1)

# Clean warning output from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
