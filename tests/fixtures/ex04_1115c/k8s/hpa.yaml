apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ex04-1115
  namespace: stream-apps
  labels:
    app: ex04-1115
    app.kubernetes.io/name: ex04-1115
    app.kubernetes.io/part-of: ex04-1115
spec:
  scaleTargetRef:
    apiVersion: apps/v1
