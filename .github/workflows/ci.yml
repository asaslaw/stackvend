# StackVend CI (FD-60). Runs with NO cloud credentials and NO secrets: every job is read-only and every test runs
# inside a loopback-only network namespace on top of the in-process hermetic guard (tests/hermetic_guard.py).
# Plan + red-team: docs/implemented/wave1-lane2-tests-ci-plan.md, docs/implemented/wave1-lane2-plan-red-team.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for read access to the repo contents only.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; every commit on main keeps its own status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # AGENTS.md mock environment + fail-closed credentials (same as the WAVE1 rules on a developer machine).
  PROJECT_ID: mock-stackvend-project
  GCP_PROJECT: mock-stackvend-project
  GOOGLE_CLOUD_PROJECT: mock-stackvend-project
  CLOUDSDK_CORE_PROJECT: mock-stackvend-project
  GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/adc-disabled.json
  TEST_MODE: "true"
  DEFAULT_REGION: us-central1
  COLUMNS: "200"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOFU_VERSION: "1.13.1"          # exact: matches castor state and the reference dev machine (orchestrator ruling)
  TOFU_RUNTIME_VERSION: "1.9.0"   # exact: what tf-applier downloads for child workloads (service.py _ensure_binary)
  RUFF_VERSION: "0.16.5"

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    # A hang detector, not a budget. The root suite is about 18,300 tests: roughly 32 minutes serially on this runner.
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three separate invocations: both MCP test files are named test_service.py (collection error if combined).
          - suite: root
            args: tests/
          - suite: tf-mcp
            args: mcp-servers/terraform/test_service.py
          - suite: k8s-mcp
            args: mcp-servers/kubernetes/test_service.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the private repo still runs the eval tests that read older commits (legacy spec pins
          # 44a2747, the healer-inventory consistency check at 6cd83b0). Since OSS blocker 1a those tests SKIP with
          # a reason when the commit is absent (shallow checkout, fresh public history), and run-time healer
          # anchoring reads eval/config/inventory_line_digests.json instead of git, so a depth-1 checkout passes.
          fetch-depth: 0

      - name: No network escape hatch in CI
        run: |
          if [ -n "${STACKVEND_ALLOW_NETWORK:-}" ]; then echo "STACKVEND_ALLOW_NETWORK must be unset in CI"; exit 1; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/control-center/requirements.txt
            apps/orchestrator-gateway/requirements.txt
            mcp-servers/terraform/requirements.txt
            mcp-servers/kubernetes/requirements.txt
            .github/ci-constraints.txt

      # tests/test_cc_identity_fd4m.py runs real (offline, provider-less) tofu; without it those tests skip.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Install dependencies (online, before entering the offline namespace)
        run: |
          python -m pip install -c .github/ci-constraints.txt \
            -r apps/control-center/requirements.txt \
            -r apps/orchestrator-gateway/requirements.txt \
            -r mcp-servers/terraform/requirements.txt \
            -r mcp-servers/kubernetes/requirements.txt \
            pytest pytest-asyncio anyio httpx

      - name: Offline namespace self-check
        run: |
          if .github/scripts/run-offline.sh python -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=5)"; then
            echo "the offline namespace can reach the internet"; exit 1
          fi
          .github/scripts/run-offline.sh python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print('loopback ok')"

      - name: pytest ${{ matrix.args }} (offline)
        run: |
          .github/scripts/run-offline.sh python -m pytest ${{ matrix.args }} -rfE -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/junit-${{ matrix.suite }}.xml"

      - name: Upload JUnit report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.suite }}
          path: ${{ runner.temp }}/junit-${{ matrix.suite }}.xml
          retention-days: 14

  lint:
    name: lint (py_compile, ruff F821/F811 ratchet, allow-lists)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # allowlist_guard compares with the base branch / previous commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: py_compile every tracked Python file
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyc
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: ruff F821/F811 fingerprint ratchet
        run: |
          python -m pip install "ruff==${RUFF_VERSION}"
          python .github/scripts/ruff_ratchet.py --ruff ruff

      - name: Allow-lists only shrink (lint baseline, known leaks, Firestore ratchet, preamble exemptions)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD~1"
          fi
          python .github/scripts/allowlist_guard.py --base "$base"

  iac-validate:
    name: tofu validate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # TEMPORARY (red-team F15): never validated before this job existed; report-only until 2026-11-15 (tracked in
    # docs/FINAL_FLIGHT_DECK.md FD-60). After that date, or once green, delete this line so it blocks merges.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform @ 1.13
            tofu: "1.13.1"
            target: platform
          - name: modules @ 1.13
            tofu: "1.13.1"
            target: modules
          - name: modules @ 1.9 (runtime parity)
            tofu: "1.9.0"
            target: modules
          - name: golden workload @ 1.9 (runtime parity)
            tofu: "1.9.0"
            target: golden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.target == 'golden'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/orchestrator-gateway/requirements.txt
            .github/ci-constraints.txt

      - name: Render the golden workload (under pytest + the offline namespace, like the pytest jobs)
        if: matrix.target == 'golden'
        run: |
          python -m pip install -c .github/ci-constraints.txt -r apps/orchestrator-gateway/requirements.txt pytest pytest-asyncio anyio httpx
          .github/scripts/run-offline.sh python -m pytest tests/test_ci_render_golden.py -p no:cacheprovider \
            --render-to="$RUNNER_TEMP/golden"

      - name: tofu init -backend=false + validate
        env:
          TF_IN_AUTOMATION: "1"
          CHECKPOINT_DISABLE: "1"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          case "$TARGET" in
            platform) dirs="infra/platform" ;;
            modules)  dirs="$(find infra/modules -name '*.tf' -exec dirname {} \; | sort -u)" ;;
            golden)   dirs="$RUNNER_TEMP/golden/infra/workload" ;;
          esac
          failed=0
          for d in $dirs; do
            echo "::group::$d"
            if (cd "$d" && tofu init -backend=false -input=false -no-color >/dev/null && tofu validate -no-color); then
              echo "OK $d"
            else
              echo "::error title=tofu validate::$d"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
