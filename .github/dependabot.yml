# Version-update pull requests are off (limit 0): pull requests are not accepted during the preview (CONTRIBUTING.md)
# and the maintainers apply these bumps themselves. A fork that wants them raises the limit and enables Dependabot
# version updates in the fork's settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
